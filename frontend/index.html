<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 탭 아이콘·사이드바 브랜드 마크 모두 기상이. 512px 원본(47KB)을 16~26px 표시에
         쓰는 건 낭비라 64px(2.7KB)로 줄여 두 곳이 함께 쓴다.
         정부상징 favicon.svg는 더 이상 쓰지 않지만 파일은 남겨 둔다. -->
    <link rel="icon" type="image/png" href="/favicon-gisang.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/gisang-i/clear_3_avatar.png" />
    <meta name="theme-color" content="#0f172a" />
    <title>ProjectAMO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
  </body>
</html>
