<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 탭 아이콘·사이드바 브랜드 마크 모두 기상이. 512px 원본(47KB)을 16~26px 표시에
         쓰는 건 낭비라 64px(2.7KB)로 줄여 두 곳이 함께 쓴다.
         정부상징 favicon.svg는 더 이상 쓰지 않지만 파일은 남겨 둔다. -->
    <link rel="icon" type="image/png" href="/favicon-gisang.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/gisang-i/clear_3_avatar.png" />
    <meta name="theme-color" content="#0f172a" />
    <title>ProjectAMO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        // 푸시 알림을 누르면 서비스 워커(sw.js)가 알림 주소를 넘겨준다. 알림 상세는 새로고침 없이 앱에서 열고
        // (App의 open-alert-detail), 다른 주소는 그 주소로 간다. 앱이 아직 뜨기 전이어도 주소에 남겨 두면 App이 시작할 때 읽는다.
        const openPushUrl = (raw) => {
          const url = new URL(raw);
          if (url.origin !== window.location.origin) return;
          const eventId = url.searchParams.get('alert');
          const testId = url.searchParams.get('alertTest');
          if (url.pathname !== '/' || (!eventId && !testId)) { window.location.assign(url.href); return; }
          window.history.replaceState(window.history.state, '', url.pathname + url.search);
          window.dispatchEvent(new CustomEvent('open-alert-detail', { detail: eventId ? { eventId } : { testId } }));
        };
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data?.type === 'open-url') openPushUrl(event.data.url);
        });
        // 이미 떠 있던 앱이 알림으로 앞에 나왔을 때를 대비해, 보일 때마다 눌린 알림이 있는지 묻는다.
        const takePending = () => { if (document.visibilityState === 'visible') navigator.serviceWorker.controller?.postMessage({ type: 'take-pending' }); };
        document.addEventListener('visibilitychange', takePending);
        window.addEventListener('focus', takePending);
        navigator.serviceWorker.ready.then(takePending);
      }
    </script>
  </body>
</html>
