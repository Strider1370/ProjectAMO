 if(t.dataset.prop){const f=find(selected);if(!f)return;const prop=t.dataset.prop;if(prop==='group'){moveItems([selected],t.value);return}if(!t.checkValidity()){t.reportValidity();return}let value=t.type==='checkbox'?t.checked:t.value;if(prop==='name'){value=value.trim();if(!value){t.value=f.s.name;toast('이름을 입력하세요.');return}}if(['radius','width','fill'].includes(prop))value=Number(value)*(prop==='radius'?17:1);if(['floor','ceiling'].includes(prop)&&value!==''){const other=Number(f.s[prop==='floor'?'ceiling':'floor']);if(f.s[prop==='floor'?'ceiling':'floor']!==''&&((prop==='floor'&&Number(value)>=other)||(prop==='ceiling'&&Number(value)<=other))){toast('천장은 바닥보다 높게 입력하세요.');t.value=f.s[prop];return}}change(()=>f.s[prop]=value)}
});
function svgPoint(e){const p=$('#map').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($('#map').getScreenCTM().inverse());return [Math.round(q.x*10)/10,Math.round(q.y*10)/10]}
$('#map').addEventListener('pointerdown',e=>{
 if(e.button!==0)return;const p=svgPoint(e),handle=e.target.closest('[data-handle]'),shapeEl=e.target.closest('[data-shape]');pointer={shapeId:shapeEl?.dataset.shape,start:p,last:p,client:[e.clientX,e.clientY],moved:false,kind:geometryEdit&&(handle||shapeEl?.dataset.shape===selected)?'geometry':!tool?'pan':'draw',handle:handle?Number(handle.dataset.handle):null,original:geometryEdit?clone(find(selected).s):null,camera:clone(camera)};$('#map').setPointerCapture(e.pointerId);
});
$('#map').addEventListener('pointermove',e=>{
 const p=svgPoint(e),c=coords(p);$('#coords').textContent=c[1]+'° N · '+c[0]+'° E';
 if(!pointer){if(tool)renderDraft(p);return}
 if(Math.hypot(e.clientX-pointer.client[0],e.clientY-pointer.client[1])>4)pointer.moved=true;
 if(pointer.kind==='pan'&&pointer.moved){const r=$('#map').getBoundingClientRect(),scale=Math.max(r.width/pointer.camera.w,r.height/pointer.camera.h);setCamera({...pointer.camera,x:pointer.camera.x-(e.clientX-pointer.client[0])/scale,y:pointer.camera.y-(e.clientY-pointer.client[1])/scale})}
 if(pointer.kind==='geometry'&&pointer.moved){const s=find(selected).s,o=pointer.original,dx=p[0]-pointer.start[0],dy=p[1]-pointer.start[1],h=pointer.handle;if(h!==null){if(s.type==='circle'){if(h===1)s.radius=Math.max(3,Math.hypot(p[0]-s.points[0],p[1]-s.points[1]));else s.points=p}else if(s.type==='point')s.points=p;else s.points[h]=p}else s.points=s.type==='point'||s.type==='circle'?[o.points[0]+dx,o.points[1]+dy]:o.points.map(c=>[c[0]+dx,c[1]+dy]);renderMap()}
});
$('#map').addEventListener('pointerup',e=>{if(pointer?.moved)suppressClick=true;clickedShape=pointer&&!pointer.moved?pointer.shapeId:null;pointer=null;if($('#map').hasPointerCapture(e.pointerId))$('#map').releasePointerCapture(e.pointerId)});
$('#map').addEventListener('pointercancel',()=>{pointer=null;suppressClick=false});
$('#map').addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}if(geometryEdit)return;if(tool){drawAt(svgPoint(e));return}const target=e.target.closest('[data-shape]'),id=target?.dataset.shape||clickedShape;clickedShape=null;if(id)selectShape(id,true);else{selected=null;render()}});
$('#map').addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e),f=e.deltaY>0?1.08:.925,w=Math.max(180,Math.min(2300,camera.w*f)),factor=w/camera.w;setCamera({x:p[0]-(p[0]-camera.x)*factor,y:p[1]-(p[1]-camera.y)*factor,w,h:camera.h*factor})},{passive:false});
document.addEventListener('keydown',e=>{
 if($('#dialog').open){if(e.key==='Enter'&&e.target.id==='dialog-input')$('#dialog .dialog-foot .primary')?.click();return}
 if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&mode==='edit'){e.preventDefault();if(e.shiftKey)redo();else undo();return}
 if(e.key==='Escape'){if(geometryEdit)cancelGeometry();else if(tool)stopTool();else{selected=null;multi=false;selection.clear();render()}return}
 if(e.key==='Enter'&&e.target.closest('[data-shape]')&&!tool){e.preventDefault();selectShape(e.target.closest('[data-shape]').dataset.shape,true);return}
 if(e.target===$('#map')&&tool){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();keyboardActive=true;const step=e.shiftKey?20:5;keyboardPoint[0]+=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;keyboardPoint[1]+=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;renderDraft(keyboardPoint)}if(e.key==='Enter'){e.preventDefault();drawAt(keyboardPoint)}}
});
$('#dialog').addEventListener('close',()=>{if(dialogReturn?.isConnected)dialogReturn.focus()});
document.addEventListener('dragstart',e=>{if(mode!=='edit')return;const handle=e.target.closest('[data-drag-item],[data-drag-group]');if(!handle){e.preventDefault();return}const id=handle.dataset.dragItem;dragData=id?{type:'items',ids:selection.has(id)?[...selection]:[id]}:{type:'group',id:handle.dataset.dragGroup};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(dragData))});
function clearDrop(){document.querySelectorAll('.drag-over,.drop-before,.group-before').forEach(n=>n.classList.remove('drag-over','drop-before','group-before'));clearTimeout(dragTimer)}
document.addEventListener('dragover',e=>{if(!dragData)return;const group=e.target.closest('[data-group-id]');if(!group)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drag-over,.drop-before,.group-before').forEach(n=>n.classList.remove('drag-over','drop-before','group-before'));const row=e.target.closest('[data-item-id]');if(dragData.type==='group')group.classList.add('group-before');else if(row)row.classList.add('drop-before');else group.classList.add('drag-over');const g=active().groups.find(g=>g.id===group.dataset.groupId);if(g.collapsed&&!dragTimer)dragTimer=setTimeout(()=>{g.collapsed=false;dragTimer=null;render()},650)});
document.addEventListener('drop',e=>{if(!dragData)return;const group=e.target.closest('[data-group-id]');if(!group)return;e.preventDefault();const target=group.dataset.groupId,row=e.target.closest('[data-item-id]');clearDrop();if(dragData.type==='items'){if(!dragData.ids.includes(row?.dataset.itemId))moveItems(dragData.ids,target,row?.dataset.itemId)}else if(dragData.id!==target){const id=dragData.id;change(()=>{const groups=active().groups,g=groups.find(g=>g.id===id);groups.splice(groups.indexOf(g),1);groups.splice(groups.findIndex(g=>g.id===target),0,g)})}dragData=null});
document.addEventListener('dragend',()=>{clearDrop();dragTimer=null;dragData=null});
// Only a completed item is persisted. An in-progress shape remains a draft.
window.addEventListener('beforeunload',e=>{if(draft.length||geometryEdit||!storageOk){e.preventDefault();e.returnValue=''}});
if(location.hash==='#edit')beginEdit();else render();
</script>
