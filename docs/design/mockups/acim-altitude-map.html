  <title>대류운정고도 · 5,000 ft 구간 지도 | ProjectAMO</title>
  <style>
/* 디자인 토큰 단일 소스 (CSS). 헌법: docs/design/design-language.md §5
   tokens.js와 1:1로 일치해야 함 (tokens.test.js가 강제). */
:root {
  /* 간격 (Fluent 2 8pt) */
  --space-none: 0;
  --space-xxs: 2px;
  --space-xs: 4px;
  --space-snudge: 6px;
  --space-s: 8px;
  --space-mnudge: 10px;
  --space-m: 12px;
  --space-l: 16px;
  --space-xl: 20px;
  --space-xxl: 24px;
  --space-xxxl: 32px;

  /* 타이포 (Pretendard) */
  --font-base: 'Pretendard GOV', system-ui, sans-serif;
  --app-font: var(--font-base);
  --fs-100: 10px;
  --fs-200: 12px;
  --fs-300: 14px;
  --fs-400: 16px;
  --fs-500: 20px;
  --fs-600: 24px;
  --fs-700: 28px;
  --fs-800: 32px;
  --fs-900: 40px;
  --lh-100: 14px;
  --lh-200: 16px;
  --lh-300: 20px;
  --lh-400: 22px;
  --lh-500: 28px;
  --lh-600: 32px;
  --lh-700: 36px;
  --lh-800: 40px;
  --lh-900: 52px;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* radius */
  --radius-none: 0;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 8px;
  --radius-circular: 9999px;

  /* 터치 (Apple HIG 최소 터치 타깃) */
  --touch-min: 44px;

  /* 중립 (Fluent 2 grey, 라이트) */
  --text-1: #242424;
  --text-2: #424242;
  --text-3: #616161;
  --text-disabled: #bdbdbd;
  --bg-1: #ffffff;
  --bg-2: #fafafa;
  --bg-3: #f5f5f5;
  --bg-4: #f0f0f0;
  --bg-5: #ebebeb;
  --stroke-1: #d1d1d1;
  --stroke-2: #e0e0e0;
  --stroke-strong: #616161;
  --accent: #334155;

  /* 시맨틱 — 레벨 */
  --level-green: #166534;
  --level-green-bg: #dcefe2;
  --level-amber: #92400e;
  --level-amber-bg: #fdecc8;
  --level-red: #c0291f;
  --level-red-bg: #f7dcd9;
  --level-gray: #475569;
  --level-gray-bg: #eef2f7;

  /* 시맨틱 — 항공 카테고리 (표준) */
  --cat-vfr: #166534;
  --cat-mvfr: #1d4ed8;
  --cat-ifr: #c0291f;
  --cat-lifr: #9d2c9d;

  /* 시맨틱 — 기상 램프 */
  --icing-1: #ACC7FF;
  --icing-2: #6B88CD;
  --icing-3: #383D6F;
  /* 회색 구름 위에 겹치는 착빙 점무늬 */
  --icing-pattern-1: #1D4ED8;
  --icing-pattern-2: #1640B8;
  --icing-pattern-3: #102B85;
  --turb-light: #64D264;
  --turb-mod: #FFC300;
  --turb-sev: #FF3737;

  /* 모션 — 시간과 속도곡선. 업무용 UI라 100~300ms를 벗어나지 않는다.
     fast: 자주 누르는 작은 것(버튼·체크). base: 패널·모달·탭. slow: 지도 카메라.
     enter는 빠르게 출발해 부드럽게 멈추고, exit는 천천히 출발해 빠르게 빠진다. */
  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-slow: 300ms;
  --motion-enter: cubic-bezier(0, 0, 0.2, 1);
  --motion-exit: cubic-bezier(0.4, 0, 1, 1);

  /* 야간 조도 — 달빛 섹션 전용. 등급색이 아니다(§4 "관습 차용"). */
  --surface-night: #1C2530; /* 무월광 칸·달 아이콘 칩 배경 전용 */
  --moon-lit: #E8B54B; /* 달 원반·달빛 곡선 전용. 이 섹션의 유일한 유채색 */
}

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-2); color: var(--text-1); font: var(--fs-300)/1.5 var(--font-base); }
    main { max-width: 1160px; margin: auto; padding: var(--space-xxl); }
    .brand { color: var(--accent); font-size: var(--fs-200); font-weight: var(--fw-bold); letter-spacing: .08em; }
    header { margin-top: var(--space-m); display: flex; justify-content: space-between; align-items: center; gap: var(--space-l); }
    h1 { margin: 0 0 var(--space-xs); font-size: var(--fs-600); letter-spacing: -.03em; }
    p { margin: 0; color: var(--text-3); }
    .demo { padding: var(--space-xs) var(--space-s); font-size: var(--fs-200); color: var(--level-amber); background: var(--level-amber-bg); border-radius: var(--radius-md); white-space: nowrap; }
    .timebar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-l); padding: var(--space-l) 0; }
    .timebar strong { font-weight: var(--fw-semibold); }
    .times { display: flex; gap: var(--space-s); }
    button { font: inherit; min-height: var(--touch-min); padding: var(--space-s) var(--space-l); background: var(--bg-1); border: 1px solid var(--stroke-1); border-radius: var(--radius-md); color: var(--text-2); cursor: pointer; }
    button[aria-pressed="true"] { background: var(--accent); color: var(--bg-1); border-color: var(--accent); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .map-card { background: var(--bg-1); border: 1px solid var(--stroke-1); border-radius: var(--radius-lg); overflow: hidden; }
    .map-stage { background: #edf0f2; }
    svg { width: 100%; display: block; height: min(64vw, 660px); }
    svg text { font-family: var(--font-base); font-size: 13px; fill: var(--text-3); }
    svg .label { paint-order: stroke; stroke: var(--bg-1); stroke-width: 4px; stroke-linejoin: round; }
    svg .city { font-size: 14px; }
    svg .strong { fill: var(--text-1); font-weight: var(--fw-semibold); }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-m) var(--space-xl); padding: var(--space-m) var(--space-l); border-top: 1px solid var(--stroke-2); font-size: var(--fs-200); }
    .legend span { display: inline-flex; align-items: center; gap: var(--space-s); }
    .height-legend { padding: var(--space-m) var(--space-l); border-top: 1px solid var(--stroke-2); }
    .height-legend strong { display: block; margin-bottom: var(--space-s); font-size: var(--fs-200); font-weight: var(--fw-semibold); }
    .height-bands { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: var(--space-s); }
    .height-band { min-width: 0; font-size: var(--fs-200); color: var(--text-2); }
    .swatch { display: block; width: 100%; height: 14px; border: 1px solid #9a8051; margin-bottom: var(--space-xs); }
    .line { display: inline-block; width: 22px; border-top: 2px dashed var(--accent); }
    footer { margin-top: var(--space-m); font-size: var(--fs-200); color: var(--text-3); }
    @media(max-width: 600px) {
      main { padding: var(--space-m); }
      header { display: block; }
      header .demo { display: inline-block; margin-top: var(--space-s); }
      h1 { font-size: var(--fs-500); }
      header p { font-size: var(--fs-200); }
      .timebar { display: block; }
      .times { margin-top: var(--space-s); }
      .times button { flex: 1; }
      svg { height: 490px; }
      svg .city { font-size: 17px; }
      .height-bands { grid-template-columns: repeat(2,minmax(0,1fr)); gap: var(--space-m); }
    }
  </style>
</head>
