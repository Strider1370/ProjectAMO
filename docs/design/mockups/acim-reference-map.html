<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACIM 원본 계산식 지도 예시 · ProjectAMO</title><style>/* 디자인 토큰 단일 소스 (CSS). 헌법: docs/design/design-language.md §5
   tokens.js와 1:1로 일치해야 함 (tokens.test.js가 강제). */
:root {
  /* 간격 (Fluent 2 8pt) */
  --space-none: 0;
  --space-xxs: 2px;
  --space-xs: 4px;
  --space-snudge: 6px;
  --space-s: 8px;
  --space-mnudge: 10px;
  --space-m: 12px;
  --space-l: 16px;
  --space-xl: 20px;
  --space-xxl: 24px;
  --space-xxxl: 32px;

  /* 타이포 (Pretendard) */
  --font-base: 'Pretendard GOV', system-ui, sans-serif;
  --app-font: var(--font-base);
  --fs-100: 10px;
  --fs-200: 12px;
  --fs-300: 14px;
  --fs-400: 16px;
  --fs-500: 20px;
  --fs-600: 24px;
  --fs-700: 28px;
  --fs-800: 32px;
  --fs-900: 40px;
  --lh-100: 14px;
  --lh-200: 16px;
  --lh-300: 20px;
  --lh-400: 22px;
  --lh-500: 28px;
  --lh-600: 32px;
  --lh-700: 36px;
  --lh-800: 40px;
  --lh-900: 52px;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* radius */
  --radius-none: 0;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 8px;
  --radius-circular: 9999px;

  /* 터치 (Apple HIG 최소 터치 타깃) */
  --touch-min: 44px;

  /* 중립 (Fluent 2 grey, 라이트) */
  --text-1: #242424;
  --text-2: #424242;
  --text-3: #616161;
  --text-disabled: #bdbdbd;
  --bg-1: #ffffff;
  --bg-2: #fafafa;
  --bg-3: #f5f5f5;
  --bg-4: #f0f0f0;
  --bg-5: #ebebeb;
  --stroke-1: #d1d1d1;
  --stroke-2: #e0e0e0;
  --stroke-strong: #616161;
  --accent: #334155;

  /* 시맨틱 — 레벨 */
  --level-green: #166534;
  --level-green-bg: #dcefe2;
  --level-amber: #92400e;
  --level-amber-bg: #fdecc8;
  --level-red: #c0291f;
  --level-red-bg: #f7dcd9;
  --level-gray: #475569;
  --level-gray-bg: #eef2f7;

  /* 시맨틱 — 항공 카테고리 (표준) */
  --cat-vfr: #166534;
  --cat-mvfr: #1d4ed8;
  --cat-ifr: #c0291f;
  --cat-lifr: #9d2c9d;

  /* 시맨틱 — 기상 램프 */
  --icing-1: #ACC7FF;
  --icing-2: #6B88CD;
  --icing-3: #383D6F;
  /* 회색 구름 위에 겹치는 착빙 점무늬 */
  --icing-pattern-1: #1D4ED8;
  --icing-pattern-2: #1640B8;
  --icing-pattern-3: #102B85;
  --turb-light: #64D264;
  --turb-mod: #FFC300;
  --turb-sev: #FF3737;

  /* 모션 — 시간과 속도곡선. 업무용 UI라 100~300ms를 벗어나지 않는다.
     fast: 자주 누르는 작은 것(버튼·체크). base: 패널·모달·탭. slow: 지도 카메라.
     enter는 빠르게 출발해 부드럽게 멈추고, exit는 천천히 출발해 빠르게 빠진다. */
  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-slow: 300ms;
  --motion-enter: cubic-bezier(0, 0, 0.2, 1);
  --motion-exit: cubic-bezier(0.4, 0, 1, 1);

  /* 야간 조도 — 달빛 섹션 전용. 등급색이 아니다(§4 "관습 차용"). */
  --surface-night: #1C2530; /* 무월광 칸·달 아이콘 칩 배경 전용 */
  --moon-lit: #E8B54B; /* 달 원반·달빛 곡선 전용. 이 섹션의 유일한 유채색 */
}
