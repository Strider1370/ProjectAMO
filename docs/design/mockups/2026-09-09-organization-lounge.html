});
document.addEventListener('input',e=>{if(e.target.id==='material-search'){materialSearch=e.target.value;document.getElementById('material-results').innerHTML=materialCards(20)}});
document.addEventListener('change',e=>{if(e.target.id==='mine'){mine=e.target.checked;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='flight-form')return;e.preventDefault();const d=new FormData(e.target),base=flights[Number(d.get('route'))];const f={...base,id:String(flights.length+1).padStart(2,'0'),name:String(d.get('name')),time:String(d.get('time')),alt:Number(d.get('alt')).toLocaleString('en-US'),pilot:String(d.get('pilot'))};if(e.target.dataset.edit==='true')flights[selected]={...f,id:current().id,note:current().note};else{flights.push(f);selected=flights.length-1}closeDialog();location.hash='flight/'+selected;render();notify('예정비행을 현재 시안에 저장했습니다.')});
document.addEventListener('keydown',e=>{if(document.getElementById('modal').open||!document.body.classList.contains('presentation')||e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();document.querySelector('[data-action="'+(e.key==='ArrowRight'?'next-flight':'prev-flight')+'"]').click()}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#present"]');if(a&&document.getElementById('prepare-note'))current().note=document.getElementById('prepare-note').value});
window.addEventListener('hashchange',()=>{document.getElementById('news-drawer').close();render();window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true})});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
document.getElementById('news-drawer').addEventListener('click',e=>{if(e.target.closest('[data-news-navigate]'))closeNews();if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeNews()}});
render();
</script>
<script src="organization-lounge-linked.js"></script>
</body>
