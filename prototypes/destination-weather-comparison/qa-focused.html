<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>디자인 QA 상세 비교</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111827; color: white; font-family: sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
      figure { margin: 0; min-width: 0; }
      figcaption { padding: 8px 0; font-weight: 700; }
      .crop { position: relative; width: 100%; height: 500px; overflow: hidden; border: 1px solid #526579; background: white; }
      .crop img { position: absolute; top: 0; left: 0; display: block; width: 1672px; height: 941px; max-width: none; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>1안 원본 · 상단/첫 열 1:1</figcaption><div class="crop"><img src="/design-references/option-1-gate-board.png" alt="" /></div></figure>
      <figure><figcaption>1안 구현 · 상단/첫 열 1:1</figcaption><div class="crop"><img src="/artifacts/exact-option-1-final-v3.png" alt="" /></div></figure>
      <figure><figcaption>3안 원본 · 상단/첫 행 1:1</figcaption><div class="crop"><img src="/design-references/option-3-forecast-rail.png" alt="" /></div></figure>
      <figure><figcaption>3안 구현 · 상단/첫 행 1:1</figcaption><div class="crop"><img src="/artifacts/exact-option-3-final-v3.png" alt="" /></div></figure>
    </main>
  </body>
</html>
